<svg xmlns="http://www.w3.org/2000/svg" width="1306" height="653" viewBox="0 0 1306 653" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1306" height="653" fill="#ffffff"/>
  <defs><marker id="m16a34a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m6366f1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker><marker id="m6b7280" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="md97706" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="mdb2777" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="mdc2626" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <text x="40" y="40" text-anchor="start" font-size="20" font-weight="600" fill="#1f2937">A run: the issues are checked, a foreman plans, workers build in parallel</text>
  <rect x="40" y="70" width="366" height="90" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="223" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">the work, written down</text>
  <text x="223" y="112" text-anchor="middle" font-size="12" fill="#4b5563">project README: why, shape, rules</text>
  <text x="223" y="128" text-anchor="middle" font-size="12" fill="#4b5563">issues: why, scenarios, out of scope, questions</text>
  <text x="223" y="144" text-anchor="middle" font-size="12" fill="#4b5563">decision records, mockups</text>
  <rect x="446" y="70" width="453" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="673" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">/analyze-issues</text>
  <text x="673" y="112" text-anchor="middle" font-size="12" fill="#92400e">an agent per issue: checks it, fixes only what fails, asks</text>
  <text x="673" y="128" text-anchor="middle" font-size="12" fill="#92400e">one check of every issue: what was dropped, what is too big</text>
  <text x="673" y="144" text-anchor="middle" font-size="12" fill="#92400e">asks you only what nothing settles</text>
  <line x1="406" y1="110" x2="444" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <rect x="186" y="220" width="568" height="74" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="470" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">/work-on foreman</text>
  <text x="470" y="262" text-anchor="middle" font-size="12" fill="#4338ca">reads the brief and every issue, works out the order, asks how many workers</text>
  <text x="470" y="278" text-anchor="middle" font-size="12" fill="#4338ca">you decide how many run at once</text>
  <path d="M 673 160 L 673 190 L 470 190 L 470 218" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#m6b7280)"/>
  <rect x="40" y="364" width="385" height="142" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="232" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">worker for issue #41</text>
  <text x="232" y="408" text-anchor="middle" font-size="12" fill="#6b7280">1. read the issue, the README, the decisions</text>
  <text x="232" y="424" text-anchor="middle" font-size="12" fill="#6b7280">2. build, test first; search memory</text>
  <text x="232" y="440" text-anchor="middle" font-size="12" fill="#6b7280">3. one verifier per scenario, then the judge</text>
  <text x="232" y="456" text-anchor="middle" font-size="12" fill="#6b7280">4. fix the list, test first; re-verify what broke</text>
  <text x="232" y="472" text-anchor="middle" font-size="12" fill="#6b7280">5. push check: tests on this commit</text>
  <text x="232" y="488" text-anchor="middle" font-size="12" fill="#6b7280">6. one pull request, Fixes #41</text>
  <rect x="461" y="364" width="385" height="142" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="653" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">worker for issue #42</text>
  <text x="653" y="408" text-anchor="middle" font-size="12" fill="#6b7280">1. read the issue, the README, the decisions</text>
  <text x="653" y="424" text-anchor="middle" font-size="12" fill="#6b7280">2. build, test first; search memory</text>
  <text x="653" y="440" text-anchor="middle" font-size="12" fill="#6b7280">3. one verifier per scenario, then the judge</text>
  <text x="653" y="456" text-anchor="middle" font-size="12" fill="#6b7280">4. fix the list, test first; re-verify what broke</text>
  <text x="653" y="472" text-anchor="middle" font-size="12" fill="#6b7280">5. push check: tests on this commit</text>
  <text x="653" y="488" text-anchor="middle" font-size="12" fill="#6b7280">6. one pull request, Fixes #42</text>
  <rect x="882" y="364" width="385" height="142" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1074" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">worker for issue #45</text>
  <text x="1074" y="408" text-anchor="middle" font-size="12" fill="#6b7280">1. read the issue, the README, the decisions</text>
  <text x="1074" y="424" text-anchor="middle" font-size="12" fill="#6b7280">2. build, test first; search memory</text>
  <text x="1074" y="440" text-anchor="middle" font-size="12" fill="#6b7280">3. one verifier per scenario, then the judge</text>
  <text x="1074" y="456" text-anchor="middle" font-size="12" fill="#6b7280">4. fix the list, test first; re-verify what broke</text>
  <text x="1074" y="472" text-anchor="middle" font-size="12" fill="#6b7280">5. push check: tests on this commit</text>
  <text x="1074" y="488" text-anchor="middle" font-size="12" fill="#6b7280">6. one pull request, Fixes #45</text>
  <path d="M 470 294 L 470 334 L 232 334 L 232 362" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" marker-end="url(#m6366f1)"/>
  <path d="M 470 294 L 470 334 L 653 334 L 653 362" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" marker-end="url(#m6366f1)"/>
  <path d="M 470 294 L 470 334 L 1074 334 L 1074 362" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" marker-end="url(#m6366f1)"/>
  <text x="232" y="326" text-anchor="middle" font-size="12" fill="#4338ca">one fresh session per issue, each in its own worktree</text>
  <path d="M 1236 364 L 1236 257 L 756 257" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m6b7280)"/>
  <text x="766" y="249" text-anchor="start" font-size="11" fill="#6b7280">questions, extras and reports come back to the foreman</text>
  <rect x="40" y="546" width="1226" height="57" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="653" y="571" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">you answer the extras each worker brings; the foreman queues it, closes its issue, and gives that worker its next issue</text>
  <text x="653" y="587" text-anchor="middle" font-size="12" fill="#166534">the run ends when every issue is merged, parked or skipped, with one line per issue saying which</text>
  <line x1="232" y1="506" x2="232" y2="544" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/>
  <line x1="653" y1="506" x2="653" y2="544" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/>
  <line x1="1074" y1="506" x2="1074" y2="544" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/>
  <text x="40" y="633" text-anchor="start" font-size="12" fill="#6b7280">A worker that stops on a failure gets one message; a second failure parks the issue with a comment. Memory steps run only when Korium is connected.</text>
</svg>

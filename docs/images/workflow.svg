<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="600" fill="#1f2937">A run: the issues are checked, a foreman plans, workers build in parallel</text>

  <!-- Row 1: before anything runs -->
  <rect x="40" y="70" width="270" height="92" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="175" y="96" text-anchor="middle" font-weight="600" fill="#374151">the work, written down</text>
  <text x="175" y="116" text-anchor="middle" font-size="12" fill="#4b5563">project README: why, shape, rules</text>
  <text x="175" y="132" text-anchor="middle" font-size="12" fill="#4b5563">issues: why, scenarios, out of scope, questions</text>
  <text x="175" y="148" text-anchor="middle" font-size="12" fill="#4b5563">decision records, mockups</text>

  <line x1="310" y1="116" x2="344" y2="116" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <rect x="346" y="70" width="270" height="92" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="481" y="96" text-anchor="middle" font-weight="600" fill="#78350f">/analyze-issues</text>
  <text x="481" y="116" text-anchor="middle" font-size="12" fill="#92400e">a reader per issue: shape, scenarios, size, questions</text>
  <text x="481" y="132" text-anchor="middle" font-size="12" fill="#92400e">a reader for the milestone: duplicates, gaps, order</text>
  <text x="481" y="148" text-anchor="middle" font-size="12" fill="#92400e">rewrites, splits, asks you what nothing settles</text>

  <line x1="616" y1="116" x2="650" y2="116" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <rect x="652" y="70" width="270" height="92" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="787" y="96" text-anchor="middle" font-weight="600" fill="#312e81">/work-on foreman</text>
  <text x="787" y="116" text-anchor="middle" font-size="12" fill="#4338ca">reads everything, proposes one plan:</text>
  <text x="787" y="132" text-anchor="middle" font-size="12" fill="#4338ca">build order, dependencies, effort, parallelism</text>
  <text x="787" y="148" text-anchor="middle" font-size="12" fill="#4338ca">you decide how many run at once</text>

  <!-- Foreman dispatch fan-out -->
  <line x1="787" y1="162" x2="787" y2="196" stroke="#6366f1" stroke-width="2"/>
  <line x1="160" y1="196" x2="780" y2="196" stroke="#6366f1" stroke-width="2"/>
  <line x1="160" y1="196" x2="160" y2="224" stroke="#6366f1" stroke-width="2" marker-end="url(#p)"/>
  <line x1="490" y1="196" x2="490" y2="224" stroke="#6366f1" stroke-width="2" marker-end="url(#p)"/>
  <line x1="780" y1="196" x2="780" y2="224" stroke="#6366f1" stroke-width="2" marker-end="url(#p)"/>
  <text x="300" y="190" text-anchor="middle" font-size="12" fill="#4338ca">one fresh session per issue, a worktree each</text>

  <!-- Three worker columns -->
  <g font-size="12">
    <rect x="40" y="226" width="240" height="250" rx="10" fill="#fafafa" stroke="#d1d5db"/>
    <text x="160" y="248" text-anchor="middle" font-weight="600" fill="#374151">worker: issue #41</text>
    <rect x="370" y="226" width="240" height="250" rx="10" fill="#fafafa" stroke="#d1d5db"/>
    <text x="490" y="248" text-anchor="middle" font-weight="600" fill="#374151">worker: issue #42</text>
    <rect x="660" y="226" width="240" height="250" rx="10" fill="#fafafa" stroke="#d1d5db"/>
    <text x="780" y="248" text-anchor="middle" font-weight="600" fill="#374151">worker: issue #45</text>
  </g>
  <!-- Steps inside each worker (drawn once per column) -->
  <g font-size="12" fill="#374151">
    <g>
      <text x="56" y="272">1. read the issue, README, decisions</text>
      <text x="56" y="292">2. plan: a change and a test per scenario</text>
      <text x="56" y="312" fill="#4338ca">   the foreman checks it, says go</text>
      <text x="56" y="332">3. build, test first; search memory</text>
      <text x="56" y="352">4. decision-record review</text>
      <text x="56" y="372">5. blind reviewers, then the judge</text>
      <text x="56" y="392">6. fix the list, test first; fix checks</text>
      <text x="56" y="412">7. English pass on customer text</text>
      <text x="56" y="432">8. push check: tests on this commit</text>
      <text x="56" y="452">9. one pull request, Fixes #41</text>
    </g>
    <g>
      <text x="386" y="272">1. read the issue, README, decisions</text>
      <text x="386" y="292">2. plan: a change and a test per scenario</text>
      <text x="386" y="312" fill="#4338ca">   the foreman checks it, says go</text>
      <text x="386" y="332">3. build, test first; search memory</text>
      <text x="386" y="352">4. decision-record review</text>
      <text x="386" y="372">5. blind reviewers, then the judge</text>
      <text x="386" y="392">6. fix the list, test first; fix checks</text>
      <text x="386" y="412">7. English pass on customer text</text>
      <text x="386" y="432">8. push check: tests on this commit</text>
      <text x="386" y="452">9. one pull request, Fixes #42</text>
    </g>
    <g>
      <text x="676" y="272">1. read the issue, README, decisions</text>
      <text x="676" y="292">2. plan: a change and a test per scenario</text>
      <text x="676" y="312" fill="#4338ca">   the foreman checks it, says go</text>
      <text x="676" y="332">3. build, test first; search memory</text>
      <text x="676" y="352">4. decision-record review</text>
      <text x="676" y="372">5. blind reviewers, then the judge</text>
      <text x="676" y="392">6. fix the list, test first; fix checks</text>
      <text x="676" y="412">7. English pass on customer text</text>
      <text x="676" y="432">8. push check: tests on this commit</text>
      <text x="676" y="452">9. one pull request, Fixes #45</text>
    </g>
  </g>
  <!-- questions back to the foreman -->
  <text x="325" y="300" text-anchor="middle" font-size="11" fill="#6b7280">questions go</text>
  <text x="325" y="314" text-anchor="middle" font-size="11" fill="#6b7280">to the foreman,</text>
  <text x="325" y="328" text-anchor="middle" font-size="11" fill="#6b7280">then to you</text>

  <!-- Merge row -->
  <line x1="160" y1="476" x2="160" y2="506" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <line x1="490" y1="476" x2="490" y2="506" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <line x1="780" y1="476" x2="780" y2="506" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <rect x="40" y="508" width="857" height="62" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="468" y="533" text-anchor="middle" font-weight="600" fill="#14532d">the foreman queues each green pull request for merge, closes the sub-issues that shipped,</text>
  <text x="468" y="553" text-anchor="middle" font-size="12" fill="#166534">and gives the worker its next ready issue. The run ends when every issue is merged, parked or skipped.</text>

  <text x="40" y="600" font-size="12" fill="#6b7280">A worker that stops on a failure gets one message; a second failure parks the issue with a comment. Memory steps run only when Korium is connected.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
</svg>

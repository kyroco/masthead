<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1000" height="400" fill="#ffffff"/>
  <defs><marker id="m16a34a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m6366f1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker><marker id="m6b7280" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="md97706" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="mdb2777" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="mdc2626" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <text x="40" y="40" text-anchor="start" font-size="20" font-weight="600" fill="#1f2937">A rule written in prose</text>
  <text x="40" y="66" text-anchor="start" font-size="14" fill="#4b5563">"Never push without running the tests."</text>
  <rect x="40" y="90" width="400" height="150" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="60" y="116" text-anchor="start" font-size="13" fill="#374151">How strongly Claude follows it</text>
  <line x1="60" y1="216" x2="420" y2="216" stroke="#9ca3af"/>
  <text x="60" y="234" text-anchor="start" font-size="12" fill="#6b7280">hour 1</text>
  <text x="240" y="234" text-anchor="middle" font-size="12" fill="#6b7280">hour 2</text>
  <text x="420" y="234" text-anchor="end" font-size="12" fill="#6b7280">hour 3</text>
  <path d="M 60 134 C 160 136, 240 164, 300 194 S 400 216, 420 216" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <text x="40" y="276" text-anchor="start" font-size="14" fill="#4b5563">It fades as the session gets long, and nobody notices</text>
  <text x="40" y="298" text-anchor="start" font-size="14" fill="#4b5563">until something has already slipped through.</text>
  <text x="520" y="40" text-anchor="start" font-size="20" font-weight="600" fill="#1f2937">The same rule as a check</text>
  <text x="520" y="66" text-anchor="start" font-size="14" fill="#4b5563">A small check runs before the action, every time.</text>
  <rect x="520" y="100" width="100" height="42" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="570" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Claude</text>
  <rect x="680" y="92" width="136" height="74" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="748" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">the check</text>
  <text x="748" y="134" text-anchor="middle" font-size="12" fill="#92400e">tests passed on</text>
  <text x="748" y="150" text-anchor="middle" font-size="12" fill="#92400e">this commit?</text>
  <line x1="620" y1="121" x2="678" y2="121" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <text x="650" y="113" text-anchor="middle" font-size="12" fill="#6b7280">git push</text>
  <rect x="866" y="104" width="90" height="42" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="911" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">pushed</text>
  <line x1="816" y1="122" x2="864" y2="122" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/>
  <text x="841" y="114" text-anchor="middle" font-size="12" fill="#16a34a">yes</text>
  <rect x="618" y="216" width="260" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="748" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">refused, with the reason</text>
  <text x="748" y="258" text-anchor="middle" font-size="12" fill="#7f1d1d">"run the tests, then push again"</text>
  <line x1="748" y1="166" x2="748" y2="214" stroke="#dc2626" stroke-width="2" marker-end="url(#mdc2626)"/>
  <text x="760" y="194" text-anchor="start" font-size="12" fill="#dc2626">no</text>
  <text x="520" y="314" text-anchor="start" font-size="14" fill="#4b5563">Claude reads the reason and does the right thing instead.</text>
  <text x="520" y="336" text-anchor="start" font-size="14" fill="#4b5563">The check runs the same way at hour one and at hour ten.</text>
</svg>

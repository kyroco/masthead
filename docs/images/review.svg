<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="600" fill="#1f2937">The review wave: blind reviewers, one judge, one fix list</text>

  <!-- Author -->
  <rect x="40" y="90" width="150" height="70" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="115" y="118" text-anchor="middle" font-weight="600" fill="#312e81">Claude, the author</text>
  <text x="115" y="140" text-anchor="middle" font-size="13" fill="#4338ca">finishes the change</text>

  <!-- The diff -->
  <rect x="240" y="90" width="120" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="300" y="118" text-anchor="middle" font-weight="600" fill="#374151">the diff</text>
  <text x="300" y="140" text-anchor="middle" font-size="13" fill="#6b7280">and nothing else</text>
  <line x1="190" y1="125" x2="238" y2="125" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <!-- Reviewers column -->
  <g font-size="13">
    <rect x="420" y="60" width="150" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="495" y="85" text-anchor="middle" fill="#78350f">reviewer: bugs</text>
    <rect x="420" y="108" width="150" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="495" y="133" text-anchor="middle" fill="#78350f">reviewer: edge cases</text>
    <rect x="420" y="156" width="150" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="495" y="181" text-anchor="middle" fill="#78350f">reviewer: contracts</text>
    <rect x="420" y="204" width="150" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="495" y="229" text-anchor="middle" fill="#78350f">reviewer: reuse</text>
    <rect x="420" y="252" width="150" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="495" y="277" text-anchor="middle" fill="#78350f">reviewer: cleanup</text>
    <rect x="420" y="300" width="150" height="40" rx="8" fill="#fee2e2" stroke="#dc2626"/><text x="495" y="325" text-anchor="middle" fill="#7f1d1d">security reviewer</text>
  </g>
  <line x1="360" y1="125" x2="418" y2="125" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="495" y="366" text-anchor="middle" font-size="13" fill="#6b7280">each reads the code cold:</text>
  <text x="495" y="384" text-anchor="middle" font-size="13" fill="#6b7280">no author's notes, no editing, no network</text>

  <!-- Findings -->
  <line x1="570" y1="200" x2="628" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="599" y="190" text-anchor="middle" font-size="12" fill="#6b7280">findings</text>

  <!-- Judge -->
  <rect x="630" y="160" width="150" height="80" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text x="705" y="188" text-anchor="middle" font-weight="600" fill="#164e63">the judge</text>
  <text x="705" y="208" text-anchor="middle" font-size="13" fill="#155e75">keeps only what</text>
  <text x="705" y="226" text-anchor="middle" font-size="13" fill="#155e75">it can prove</text>

  <!-- Thrown out -->
  <line x1="705" y1="240" x2="705" y2="290" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <rect x="640" y="292" width="130" height="36" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="705" y="315" text-anchor="middle" font-size="13" fill="#6b7280">thrown out</text>

  <!-- Fix list -->
  <line x1="780" y1="200" x2="838" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <rect x="840" y="170" width="90" height="60" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="885" y="195" text-anchor="middle" font-weight="600" fill="#14532d">fix list</text>
  <text x="885" y="215" text-anchor="middle" font-size="12" fill="#166534">file:line each</text>

  <!-- Back to author -->
  <path d="M 885 230 C 885 440, 115 440, 115 160" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#p)"/>
  <text x="500" y="445" text-anchor="middle" fill="#4338ca">the author fixes each one, test first, then the wave runs again until the list is empty</text>

  <text x="40" y="490" fill="#4b5563">Then: the push check, and one pull request.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
  </defs>
</svg>

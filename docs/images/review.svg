<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="552" viewBox="0 0 1470 552" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1470" height="552" fill="#ffffff"/>
  <defs><marker id="m16a34a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m6366f1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker><marker id="m6b7280" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="md97706" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="mdb2777" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="mdc2626" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <text x="40" y="40" text-anchor="start" font-size="20" font-weight="600" fill="#1f2937">The verification: verifiers who read cold, and a judge that reads and places</text>
  <rect x="40" y="120" width="280" height="74" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="180" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">the worker</text>
  <text x="180" y="162" text-anchor="middle" font-size="12" fill="#4338ca">finishes the change and sends</text>
  <text x="180" y="178" text-anchor="middle" font-size="12" fill="#4338ca">each scenario, the diff, its claims</text>
  <rect x="370" y="70" width="170" height="32" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="455" y="90" text-anchor="middle" font-size="12" fill="#92400e">verifier: scenario 1</text>
  <rect x="370" y="110" width="170" height="32" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="455" y="130" text-anchor="middle" font-size="12" fill="#92400e">verifier: scenario 2</text>
  <rect x="370" y="150" width="170" height="32" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="455" y="170" text-anchor="middle" font-size="12" fill="#92400e">verifier: scenario 3</text>
  <rect x="370" y="190" width="170" height="32" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="455" y="210" text-anchor="middle" font-size="12" fill="#92400e">verifier: scenario 4</text>
  <rect x="370" y="230" width="170" height="32" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="455" y="250" text-anchor="middle" font-size="12" fill="#7f1d1d">security reviewer</text>
  <rect x="370" y="272" width="315" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="528" y="292" text-anchor="middle" font-size="12" fill="#6b7280">each one tries to make every claim false:</text>
  <text x="528" y="308" text-anchor="middle" font-size="12" fill="#6b7280">no author's notes, no editing, no network</text>
  <line x1="320" y1="160" x2="368" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <rect x="610" y="150" width="352" height="122" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="786" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#164e63">the judge</text>
  <text x="786" y="192" text-anchor="middle" font-size="12" fill="#155e75">reads the code along each false claim's path,</text>
  <text x="786" y="208" text-anchor="middle" font-size="12" fill="#155e75">nothing from the worker,</text>
  <text x="786" y="224" text-anchor="middle" font-size="12" fill="#155e75">and places it; that is final for the worker;</text>
  <text x="786" y="240" text-anchor="middle" font-size="12" fill="#155e75">an unsettled security finding</text>
  <text x="786" y="256" text-anchor="middle" font-size="12" fill="#155e75">goes to you</text>
  <line x1="540" y1="168" x2="608" y2="168" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <text x="575" y="158" text-anchor="middle" font-size="12" fill="#6b7280">false claims</text>
  <rect x="1022" y="90" width="338" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1191" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">the fix list</text>
  <text x="1191" y="132" text-anchor="middle" font-size="12" fill="#166534">a Then is false, something broke, or words</text>
  <text x="1191" y="148" text-anchor="middle" font-size="12" fill="#166534">a person reads are wrong; a file and a line</text>
  <rect x="1022" y="188" width="388" height="90" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="1216" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">extras</text>
  <text x="1216" y="230" text-anchor="middle" font-size="12" fill="#4b5563">real, but not this change's to fix: the worker</text>
  <text x="1216" y="246" text-anchor="middle" font-size="12" fill="#4b5563">brings you what scores 8 or higher, and you answer</text>
  <text x="1216" y="262" text-anchor="middle" font-size="12" fill="#4b5563">each: fix now, fix later, or proceed</text>
  <rect x="1022" y="302" width="222" height="74" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1133" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">thrown out</text>
  <text x="1133" y="344" text-anchor="middle" font-size="12" fill="#6b7280">does not hold, or is noise;</text>
  <text x="1133" y="360" text-anchor="middle" font-size="12" fill="#6b7280">gone for good</text>
  <line x1="962" y1="180" x2="1020" y2="127" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/>
  <line x1="962" y1="200" x2="1020" y2="233" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <line x1="962" y1="220" x2="1020" y2="339" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m6b7280)"/>
  <rect x="542" y="406" width="489" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="786" y="430" text-anchor="middle" font-size="12" fill="#4338ca">the worker fixes each item on the list, test first,</text>
  <text x="786" y="446" text-anchor="middle" font-size="12" fill="#4338ca">and only the claims the fix broke are re-verified, at most twice</text>
  <path d="M 1360 110 L 1434 110 L 1434 492 L 180 492 L 180 196" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" marker-end="url(#m6366f1)"/>
  <text x="40" y="532" text-anchor="start" font-size="13" fill="#4b5563">Then: the tests run on the final commit, and one pull request goes up.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315" viewBox="0 0 1000 315" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1000" height="315" fill="#ffffff"/>
  <defs><marker id="m16a34a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m6366f1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker><marker id="m6b7280" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="md97706" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="mdb2777" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="mdc2626" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <text x="40" y="34" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">Nine small agents, one per issue, all at once</text>
  <rect x="40" y="50" width="88" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="84" y="68" text-anchor="middle" font-size="12" fill="#92400e">agent, #41</text>
  <rect x="136" y="50" width="88" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="68" text-anchor="middle" font-size="12" fill="#92400e">agent, #42</text>
  <rect x="232" y="50" width="88" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="276" y="68" text-anchor="middle" font-size="12" fill="#92400e">agent, #43</text>
  <rect x="328" y="50" width="88" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="372" y="68" text-anchor="middle" font-size="12" fill="#92400e">agent, #44</text>
  <rect x="424" y="50" width="88" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="468" y="68" text-anchor="middle" font-size="12" fill="#92400e">agent, #45</text>
  <rect x="520" y="50" width="88" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="564" y="68" text-anchor="middle" font-size="12" fill="#92400e">agent, #46</text>
  <rect x="616" y="50" width="88" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="660" y="68" text-anchor="middle" font-size="12" fill="#92400e">agent, #47</text>
  <rect x="712" y="50" width="88" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="756" y="68" text-anchor="middle" font-size="12" fill="#92400e">agent, #48</text>
  <rect x="808" y="50" width="88" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="852" y="68" text-anchor="middle" font-size="12" fill="#92400e">agent, #49</text>
  <rect x="40" y="110" width="453" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="266" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">each asks four things, then rewrites its issue</text>
  <text x="266" y="151" text-anchor="middle" font-size="12" fill="#92400e">Does it say what must be true, or how to build it?</text>
  <text x="266" y="167" text-anchor="middle" font-size="12" fill="#92400e">Can I read scenarios out of it, and what does each rest on?</text>
  <text x="266" y="183" text-anchor="middle" font-size="12" fill="#92400e">Is it too big for one pull request?</text>
  <text x="266" y="199" text-anchor="middle" font-size="12" fill="#92400e">What would a builder have to guess?</text>
  <rect x="523" y="110" width="371" height="121" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="708" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">then one more agent checks every rewrite</text>
  <text x="708" y="151" text-anchor="middle" font-size="12" fill="#92400e">Did a rewrite drop anything? It puts it back.</text>
  <text x="708" y="167" text-anchor="middle" font-size="12" fill="#92400e">Are two issues building the same thing?</text>
  <text x="708" y="183" text-anchor="middle" font-size="12" fill="#92400e">Does one contradict the decision record?</text>
  <text x="708" y="199" text-anchor="middle" font-size="12" fill="#92400e">Is there a decision nobody is building?</text>
  <text x="708" y="215" text-anchor="middle" font-size="12" fill="#92400e">Is the order right? It fixes the links.</text>
  <rect x="40" y="235" width="854" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="467" y="259" text-anchor="middle" font-size="12" fill="#4b5563">Then: big ones split, questions looked up in the sources,</text>
  <text x="467" y="275" text-anchor="middle" font-size="12" fill="#4b5563">and only what nothing settles comes to you, one at a time, with a recommendation</text>
</svg>

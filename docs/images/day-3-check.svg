<svg xmlns="http://www.w3.org/2000/svg" width="1011" height="315" viewBox="0 0 1011 315" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1011" height="315" fill="#ffffff"/>
  <defs><marker id="m16a34a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m6366f1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker><marker id="m6b7280" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="md97706" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="mdb2777" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="mdc2626" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <text x="40" y="34" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">Nine small readers, one per issue, all at once</text>
  <rect x="40" y="50" width="95" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="88" y="68" text-anchor="middle" font-size="12" fill="#92400e">reader, #41</text>
  <rect x="143" y="50" width="95" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="191" y="68" text-anchor="middle" font-size="12" fill="#92400e">reader, #42</text>
  <rect x="246" y="50" width="95" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="294" y="68" text-anchor="middle" font-size="12" fill="#92400e">reader, #43</text>
  <rect x="350" y="50" width="95" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="397" y="68" text-anchor="middle" font-size="12" fill="#92400e">reader, #44</text>
  <rect x="453" y="50" width="95" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="68" text-anchor="middle" font-size="12" fill="#92400e">reader, #45</text>
  <rect x="556" y="50" width="95" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="604" y="68" text-anchor="middle" font-size="12" fill="#92400e">reader, #46</text>
  <rect x="659" y="50" width="95" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="707" y="68" text-anchor="middle" font-size="12" fill="#92400e">reader, #47</text>
  <rect x="762" y="50" width="95" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="810" y="68" text-anchor="middle" font-size="12" fill="#92400e">reader, #48</text>
  <rect x="866" y="50" width="95" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="913" y="68" text-anchor="middle" font-size="12" fill="#92400e">reader, #49</text>
  <rect x="40" y="110" width="453" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="266" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">each one asks the same four things</text>
  <text x="266" y="151" text-anchor="middle" font-size="12" fill="#92400e">Does it say what must be true, or how to build it?</text>
  <text x="266" y="167" text-anchor="middle" font-size="12" fill="#92400e">Can I read scenarios out of it, and what does each rest on?</text>
  <text x="266" y="183" text-anchor="middle" font-size="12" fill="#92400e">Is it too big for one pull request?</text>
  <text x="266" y="199" text-anchor="middle" font-size="12" fill="#92400e">What would a builder have to guess?</text>
  <rect x="523" y="110" width="448" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="747" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">one more reader looks at the milestone as a whole</text>
  <text x="747" y="151" text-anchor="middle" font-size="12" fill="#92400e">Are two issues building the same thing?</text>
  <text x="747" y="167" text-anchor="middle" font-size="12" fill="#92400e">Does one contradict the decision record?</text>
  <text x="747" y="183" text-anchor="middle" font-size="12" fill="#92400e">Is there a decision nobody is building?</text>
  <text x="747" y="199" text-anchor="middle" font-size="12" fill="#92400e">Is the order right?</text>
  <rect x="40" y="235" width="931" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="506" y="259" text-anchor="middle" font-size="12" fill="#4b5563">Then: issues rewritten (you approve the first), big ones split, questions looked up in the sources,</text>
  <text x="506" y="275" text-anchor="middle" font-size="12" fill="#4b5563">and only what nothing settles comes to you, one at a time, with a recommendation</text>
</svg>

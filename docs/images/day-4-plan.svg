  <rect x="40" y="30" width="414" height="158" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="247" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">the foreman, in a sentence</text>
  <text x="247" y="74" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4338ca">Got it: 9 issues, the first three can start today,</text>
  <text x="247" y="90" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4338ca">the rest wait on #41. How many workers?</text>
  <text x="247" y="106" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4338ca"></text>
  <text x="247" y="122" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4338ca">#41  a member shares a memory into a workspace</text>
  <text x="247" y="138" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4338ca">#42  the owner stops sharing it again</text>
  <text x="247" y="154" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4338ca">#44  the Inbox lists what needs your answer</text>
  <text x="247" y="170" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4338ca">#41 has one question for you; the other two have none</text>
  <line x1="454" y1="120" x2="504" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <circle cx="614" cy="70" r="26" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="614" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#9d174d">you</text>
  <text x="614" y="34" text-anchor="middle" font-size="12" fill="#6b7280">you pick how many run at once</text>
  <rect x="534" y="120" width="294" height="58" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="681" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#9d174d">"three"</text>
  <text x="681" y="162" text-anchor="middle" font-size="12" fill="#9d174d">nothing starts until you say a number</text>

# Masthead's batch run, last part: move main to a green batch (INFRA-270).
#
# A repository's starter file (skills/setup/batch-starter.yml) calls this only
# after its Gate passed on the batch's last commit. It moves main to exactly
# that commit, forward only, as the GitHub App the main ruleset lets through
# (Robert, November 19, 2026: "app route confirmed"; proven in INFRA-256). It
# never moves main when the Gate did not pass, when the commit is not on the
# pile's branch (`landing`, or `hotfix` for a hotfix's own pile, INFRA-286), or
# when main holds a commit the batch does not.
#
# The one move without a Gate run (INFRA-287): the plan found the batch changes
# only documents since main, or nothing, and skipped the Gate. The move then
# checks that again itself, with main's own list of document paths, before it
# moves main.
#
# references/batch-run.md says how the parts fit.
name: Masthead batch move

on:
  workflow_call:
    inputs:
      sha:
        description: The batch's last commit, from the batch plan; the commit the Gate tested.
        required: true
        type: string
      gate-result:
        description: How the Gate job ended (needs.gate.result). Main moves on success, or on skipped with proof documents.
        required: true
        type: string
      proof:
        description: The plan's proof output; "documents" when it skipped the Gate because the batch changes only documents.
        required: false
        type: string
        default: ""
    secrets:
      BATCH_APP_ID:
        required: true
      BATCH_APP_PRIVATE_KEY:
        required: true

jobs:
  move:
    runs-on: ubuntu-latest
    # The App key lives in this environment, which only `landing` and `hotfix` may use, and
    # GitHub hands its secrets only to a job that names it: this one, not the
    # repository's Gate, which the starter calls with `secrets: inherit` (INFRA-272).
    environment: masthead-batch
    permissions:
      contents: read
    steps:
      - name: Get a token from the batch App
        id: app
        if: inputs.gate-result == 'success' || (inputs.gate-result == 'skipped' && inputs.proof == 'documents')
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BATCH_APP_ID }}
          private-key: ${{ secrets.BATCH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        if: inputs.gate-result == 'success' || (inputs.gate-result == 'skipped' && inputs.proof == 'documents')
        with:
          ref: ${{ inputs.sha }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .claude
      - name: Move main to the batch
        id: move
        env:
          SHA: ${{ inputs.sha }}
          GATE_RESULT: ${{ inputs.gate-result }}
          PROOF: ${{ inputs.proof }}
        run: |
          set -u
          stop() {
            echo "::error::$1"
            printf '%s\n' "$1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          }
          # documents-only: begin. These lines are the same in batch-plan.yml and batch-move.yml.
          # documents_only BASE HEAD returns 0 when HEAD's files differ from BASE's only in the paths
          # BASE's own .claude/gate.json names as documents, or not at all, and 1 otherwise; either way it
          # prints why, so a no never reads as more than it knows (s4-J1).
          # A pattern's * stands for any run of characters, a / included, and ? for one, as setup stored it.
          documents_only() {
            changed="$(mktemp)"
            if ! git diff --no-renames --name-only -z "$1" "$2" -- > "$changed"; then
              echo "Git could not compare the batch with main, so it cannot tell what the batch changes."
              return 1
            fi
            if [ ! -s "$changed" ]; then
              echo "The batch's files are the same as main's: nothing in it is new."
              return 0
            fi
            patterns="$(git show "$1:.claude/gate.json" 2>/dev/null | jq -r '.documents
              | if type == "array" and length > 0 and all(.[]; type == "string" and length <= 200
                  and test("^[A-Za-z0-9._*?+@-][A-Za-z0-9._*?/+@-]*$") and test("[A-Za-z0-9]"))
                then .[] else empty end' 2>/dev/null)" || patterns=""
            if [ -z "$patterns" ]; then
              echo "Main's .claude/gate.json names no document paths that can be read, so no change counts as a document."
              return 1
            fi
            count=0
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/* | .claude/gate.json)
                  echo "The batch changes $path, a check or the stored Gate itself, and a change to those always runs the Gate, whatever main's .claude/gate.json names."
                  return 1
                  ;;
              esac
              hit=""
              while IFS= read -r pattern; do
                case "$path" in $pattern) hit=1; break ;; esac
              done <<< "$patterns"
              if [ -z "$hit" ]; then
                echo "The batch changes $path, which is not a document by main's .claude/gate.json, so it changes more than documents."
                return 1
              fi
              count=$((count + 1))
            done < "$changed"
            echo "The batch changes only documents since main ($count file(s)), as main's .claude/gate.json names them."
            return 0
          }
          # documents-only: end.
          # The Gate passed, or the plan skipped it because the batch changes only documents (INFRA-287),
          # which is checked again below, against main as this step reads it, before main moves.
          documents=""
          if [ "$GATE_RESULT" = "skipped" ] && [ "${PROOF:-}" = "documents" ]; then
            documents=1
          elif [ "$GATE_RESULT" != "success" ]; then
            stop "The Gate ended '$GATE_RESULT' on $SHA, so main does not move."
          fi
          # The milestone pile on landing, or a hotfix's own pile on hotfix (INFRA-286).
          case "${GITHUB_REF:-}" in
            refs/heads/landing | refs/heads/hotfix) branch="${GITHUB_REF#refs/heads/}" ;;
            *) stop "The batch run moves main only from the landing or hotfix branch, and this run is on ${GITHUB_REF:-no branch}. Main does not move." ;;
          esac
          case "$SHA" in
            *[!0-9a-f]* | "") stop "'$SHA' is not a full commit id, so main does not move." ;;
          esac
          [ "${#SHA}" -eq 40 ] || stop "'$SHA' is not a full commit id, so main does not move."
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main "+refs/heads/$branch:refs/remotes/origin/$branch" ||
            stop "Could not read main and $branch from GitHub, so main does not move."
          main="$(git rev-parse --verify --quiet 'refs/remotes/origin/main^{commit}')" || stop "This repository has no main branch, so main does not move."
          git cat-file -e "$SHA^{commit}" 2>/dev/null || stop "Commit $SHA is not in this repository, so main does not move."
          git merge-base --is-ancestor "$SHA" "refs/remotes/origin/$branch" ||
            stop "Commit $SHA is no longer on $branch, so main does not move."
          if [ "$main" = "$SHA" ]; then
            printf 'Main is already at %s; nothing to move.\n' "$SHA" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          # The two piles run apart (INFRA-286), so the other one can reach main while this batch runs.
          # The Gate passed on code that lacks what main now holds: it is retested, never blamed (s2-J1).
          git merge-base --is-ancestor "$main" "$SHA" ||
            stop "Main moved to $main while this batch ran, and holds work batch $SHA was not tested with (most often the other pile, landing or hotfix, reached main first), so moving it would drop work. Main does not move. Nothing in this batch is to blame: give the same go again. It brings main in with one merge and tests the two together, or, when it cannot make or push that merge on its own, it stops and says to merge by hand first."
          if [ -n "$documents" ]; then
            why="$(documents_only "$main" "$SHA")" ||
              stop "The Gate did not run on $SHA, and main ($main) does not move: $why"
            printf '%s No Gate run was needed.\n' "$why" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          {
            printf 'Main moves from %s to %s, carrying:\n\n' "$main" "$SHA"
            git log --format='- %h %s (%an)' "$main..$SHA"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # A plain push, never forced: git refuses it unless main is still behind the batch.
          git push --quiet origin "$SHA:refs/heads/main" || stop "GitHub refused the move of main to $SHA, so main has not moved."
          printf 'Main is now at %s.\n' "$SHA" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

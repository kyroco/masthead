name: tests
# The batch run calls this as the repository's Gate (workflow_call), and a
# person can start it by hand (workflow_dispatch); .claude/gate.json names it.
on:
  # Not on landing or main: the batch run tests the pile on landing when the
  # person says go, and main only ever moves to a commit that run proved.
  push:
    branches-ignore: [landing, main]
  pull_request:
  workflow_call:
  workflow_dispatch:
jobs:
  hooks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run the hook suites
        run: bash hooks/run-tests.sh
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and the marketplace
        run: claude plugin validate --strict .

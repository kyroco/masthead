# Masthead's batch run, first part: check the stored Gate before a batch starts (INFRA-270).
#
# A repository's starter file (skills/setup/batch-starter.yml) calls this when
# the person says go (skills/work-on/batch-go.py starts the starter on
# `landing`; a push starts nothing, INFRA-285), before it runs the repository's
# own Gate. It stops a run that no go started, and one whose `landing` moved
# after the go checked the pile, so the Gate tests the pile the go named. It reads
# `.claude/gate.json`, the answer Masthead's setup stored after the person's
# yes (references/gate-fact.md), at the batch's own commit, and the starter
# file that called it, to check the starter's Gate job runs that Gate and no
# other workflow of the repository. It never works the Gate out: with no
# answer stored, or one the starter does not run, it stops here, so the Gate
# and the move of main never start.
#
# Its output `sha` is the batch's last commit, the one the Gate tests and the
# one main moves to. Its output `test` is false, and `proof` is `documents`,
# when that commit differs from main only in the paths main's own
# .claude/gate.json names as documents, or not at all: then the Gate does not
# run and the move checks the same thing again before it moves main (INFRA-287).
# references/batch-run.md says how the parts fit.
name: Masthead batch plan

on:
  workflow_call:
    inputs:
      sha:
        description: Landing's last commit when the go was given (batch-go.py).
        required: false
        type: string
        default: ""
      pile:
        description: What the go was for, a milestone or a set of issues.
        required: false
        type: string
        default: ""
      issues:
        description: The issues on the pile.
        required: false
        type: string
        default: ""
    outputs:
      sha:
        description: The batch's last commit, which the Gate tests and main moves to when it is green.
        value: ${{ jobs.plan.outputs.sha }}
      test:
        description: "\"false\" when the batch changes only documents since main, or nothing, so the Gate does not run; \"true\" otherwise."
        value: ${{ jobs.plan.outputs.test }}
      proof:
        description: "What lets main move: \"gate\", a Gate run that passed, or \"documents\", which the move checks again."
        value: ${{ jobs.plan.outputs.proof }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      test: ${{ steps.proof.outputs.test }}
      proof: ${{ steps.proof.outputs.proof }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          # Commits and folders only, so the proof step can read main's without the whole of it.
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            .claude
            .github
      - name: Read the stored Gate
        id: plan
        env:
          # In a called workflow this is the caller's: the starter file, at the batch's commit.
          STARTER_REF: ${{ github.workflow_ref }}
          GO_SHA: ${{ inputs.sha }}
          GO_PILE: ${{ inputs.pile }}
          GO_ISSUES: ${{ inputs.issues }}
        run: |
          set -u
          file=.claude/gate.json
          oldway="Run /masthead:setup to store one; until then this repository ships the way it did before the batch run."
          stop() {
            echo "::error::$1"
            printf '%s\n' "$1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          }
          # Two piles: the milestone pile on landing, and a hotfix's own pile on hotfix (INFRA-286).
          case "${GITHUB_REF:-}" in
            refs/heads/landing | refs/heads/hotfix) branch="${GITHUB_REF#refs/heads/}" ;;
            *) stop "The batch run tests only the landing and hotfix branches, and this run is on ${GITHUB_REF:-no branch}. It does not start, and main does not move." ;;
          esac
          # Only a go starts a batch (INFRA-285). An older starter still starts on every push to landing.
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            stop "A batch run starts only when the person says go, and this run started on a ${GITHUB_EVENT_NAME:-unknown} event, so it does not start and main does not move. This starter file is older than that: run /masthead:setup to write it again."
          fi
          if [ -z "${GO_SHA:-}" ]; then
            stop "This run names no commit for the go, so it does not start and main does not move. Start it with batch-go.py, which checks the pile first."
          fi
          if [ "$GO_SHA" != "${GITHUB_SHA:-}" ]; then
            stop "The $branch branch moved after the go: the go checked $GO_SHA, and $branch is now at ${GITHUB_SHA:-nothing}. The run does not start and main does not move. Say go again so the new commits are checked too."
          fi
          if [ -L "$file" ] || [ ! -f "$file" ]; then
            stop "No Gate is stored in .claude/gate.json, so the batch run does not start and main does not move. $oldway"
          fi
          workflow="$(jq -er '.workflow | strings' "$file" 2>/dev/null)" ||
            stop ".claude/gate.json names no Gate workflow, so the batch run does not start and main does not move. $oldway"
          if ! jq -e '.starts | arrays | index("workflow_call") != null' "$file" >/dev/null 2>&1; then
            stop "The stored Gate, $workflow, cannot be started with workflow_call, which is how the batch run starts it. The batch run does not start, and main does not move."
          fi
          # The starter's own `uses: ./...` lines are what GitHub runs as the Gate; read them, not a label.
          starter="${STARTER_REF:-}"
          starter="${starter#"${GITHUB_REPOSITORY:-}/"}"
          starter="${starter%%@*}"
          case "$starter" in
            .github/workflows/*) ;;
            *) stop "The batch run cannot tell which starter file started it ('${STARTER_REF:-}'), so it does not start and main does not move." ;;
          esac
          if [ -L "$starter" ] || [ ! -f "$starter" ]; then
            stop "The starter file $starter is not a plain file at this commit, so the batch run does not start and main does not move."
          fi
          runs="$(tr -d '\r' < "$starter" | grep -E '^[[:space:]]*(-[[:space:]]+)?uses[[:space:]]*:[[:space:]]*\./' | sed -E 's/^[^:]*:[[:space:]]*\.\///; s/[[:space:]]+#.*$//; s/[[:space:]]*$//' | paste -sd ' ' -)" || runs=""
          if [ "$runs" != "$workflow" ]; then
            stop "The starter file runs ${runs:-no workflow of this repository} as the Gate, but the Gate stored in .claude/gate.json is $workflow. The batch run runs only the stored Gate, so it does not start and main does not move. Run /masthead:setup to write the starter file again."
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'Batch %s, the go for %s (%s): the Gate is %s, as stored in .claude/gate.json.\n' "$GITHUB_SHA" "${GO_PILE:-no pile named}" "${GO_ISSUES:-no issues named}" "$workflow" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      # INFRA-287. Robert, November 19, 2026: "Why do we run ANYTHING for a document commit? Why?"
      # Main is code a Gate run already passed, so a batch that adds nothing to it but documents needs
      # no Gate run. Anything this step cannot read runs the Gate, as before.
      - name: Decide whether the Gate runs
        id: proof
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -u
          say() { printf '%s\n' "$1" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"; }
          # Read main from GitHub with this run's own read token, for this step's git calls only.
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN:-}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0
          # documents-only: begin. These lines are the same in batch-plan.yml and batch-move.yml.
          # documents_only BASE HEAD prints why and returns 0 when HEAD's files differ from BASE's only in
          # the paths BASE's own .claude/gate.json names as documents, or not at all; it returns 1 otherwise.
          # A pattern's * stands for any run of characters, a / included, and ? for one, as setup stored it.
          documents_only() {
            changed="$(mktemp)"
            git diff --no-renames --name-only -z "$1" "$2" -- > "$changed" || return 1
            if [ ! -s "$changed" ]; then
              echo "The batch's files are the same as main's: nothing in it is new."
              return 0
            fi
            patterns="$(git show "$1:.claude/gate.json" 2>/dev/null | jq -r '.documents
              | if type == "array" and length > 0 and all(.[]; type == "string" and length <= 200
                  and test("^[A-Za-z0-9._*?+@-][A-Za-z0-9._*?/+@-]*$") and test("[A-Za-z0-9]"))
                then .[] else empty end' 2>/dev/null)" || return 1
            [ -n "$patterns" ] || return 1
            count=0
            while IFS= read -r -d '' path; do
              case "$path" in .github/* | .claude/gate.json) return 1 ;; esac
              hit=""
              while IFS= read -r pattern; do
                case "$path" in $pattern) hit=1; break ;; esac
              done <<< "$patterns"
              [ -n "$hit" ] || return 1
              count=$((count + 1))
            done < "$changed"
            echo "The batch changes only documents since main ($count file(s)), as main's .claude/gate.json names them."
            return 0
          }
          # documents-only: end.
          test=true
          proof=gate
          if git fetch --quiet --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main 2>/dev/null &&
            why="$(documents_only refs/remotes/origin/main "$GITHUB_SHA")"; then
            test=false
            proof=documents
            say "$why So the Gate does not run, and main moves to $GITHUB_SHA once the move checks this again."
          else
            say "The batch changes more than documents since main, so the Gate runs on $GITHUB_SHA."
          fi
          echo "test=$test" >> "$GITHUB_OUTPUT"
          echo "proof=$proof" >> "$GITHUB_OUTPUT"
